title: Sensitive Data Detected in AI Model Output
id: 16102a3f-47bc-564a-b84d-5038b12556ce
status: experimental
description: PII or secrets detected in a model response
author: Amit Ambekar
date: 2026/10/20
tags:
    - compliance.iso27090
    - compliance.gdpr
logsource:
    product: ai
    service: gateway
detection:
    selection:
        ai.guardrail.category:
            - pii
            - secrets
        ai.guardrail.action:
            - redact
            - flag
            - block
    condition: selection
falsepositives:
    - Authorised red-team or guardrail testing
level: high
