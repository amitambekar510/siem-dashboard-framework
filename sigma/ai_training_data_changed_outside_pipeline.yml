title: AI Training Data Written or Deleted Outside Approved Pipeline
id: f1437fa9-540f-5607-9abc-6578c9fc8a40
status: experimental
description: Dataset write or delete without an approved pipeline identity (possible data poisoning footprint)
author: Amit Ambekar
date: 2026/10/20
tags:
    - compliance.iso27090
logsource:
    product: ai
    service: datastore
detection:
    selection:
        ai.data.operation:
            - write
            - delete
    filter:
        ai.pipeline.id|exists: true
    condition: selection and not filter
falsepositives:
    - Authorised red-team or guardrail testing
level: high
